<!DOCTYPE html>
<!-- made with opencode -->
<!-- by https://github.com/RustaCPVP -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store | Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; color: silver; font-family: 'proxima-nova', 'Raleway', sans-serif; background: #111; line-height: normal; }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .page-wrapper { background: #111; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
    .main-content { flex: 1; }

    .loading-wrap { display: none; align-items: center; justify-content: center; position: fixed; inset: 0; background: #111; z-index: 500; flex-direction: column; color: #424549; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; gap: 30px; }
    .loading-wrap svg { width: 65px; height: 65px; }
    .loading-wrap strong { color: #fff; }
    body.loading .loading-wrap { display: flex; }
    body.loading { overflow: hidden; }

    .head { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 20px 60px; min-height: 325px; }
    .top-nav { display: flex; align-items: center; justify-content: center; gap: 30px; margin-bottom: 40px; }
    .top-nav a { padding: 14px 20px; background: #212428; border-radius: 12px; color: #bababa; min-width: 114px; font-weight: 700; text-transform: uppercase; font-size: 13px; border: 2px solid #2a5870; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,.08); transition: all .15s ease; }
    .top-nav a:hover, .top-nav a.active { color: #fff; border-color: #036fff; }
    .logo { max-width: 124px; margin: 0 auto; }
    .below-logo { margin-top: 12px; }
    .ip-block { display: inline-flex; align-items: center; background: #1e1e1e; padding: 7px 20px; font-size: 22px; font-weight: 700; color: #fff; border-radius: 10px; border-bottom: 6px solid #000; cursor: pointer; transition: all .15s ease; }
    .ip-block:hover { color: #036fff; }
    .ip-players { display: none; background: #3a3e41; margin-left: 12px; padding: 0 12px; border-left: 1px solid #ffffff2e; font-size: 14px; color: #999; height: 36px; align-items: center; }
    .page-wrapper-inner { padding-bottom: 20px; }
    .panel-wrap { background: #1e1e1e; border-bottom: 8px solid #000; box-shadow: 0 10px 55px -3px rgba(0,0,0,.06), 0 4px 6px -2px rgba(0,0,0,.05); margin-bottom: 0; }
    .panel-header { text-align: center; border-bottom: none; padding: 50px 0 0; font-size: 39px; font-weight: 900; }
    .panel-wrap .container { display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; }

    .section-title { display: flex; position: relative; height: 45px; align-items: center; width: 100%; justify-content: center; color: #fff; }
    .section-title > span { color: #8d8d8d; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; font-size: 19px; }

    .tab-content { width: 100%; margin-top: 20px; }
    .package-wrap { display: flex; gap: 30px; width: 100%; justify-content: center; margin-top: 20px; }

    .package-item { flex: 0 1 320px; background: #424549; padding: 30px; text-align: center; border-radius: 36px; display: flex; flex-direction: column; gap: 15px; transition: transform .15s ease; border-bottom: 8px solid #000; }
    .package-item:hover { transform: scale(1.03); }
    .package-item .image { height: 220px; border-radius: 36px; overflow: hidden; position: relative; background: linear-gradient(180deg, #036fff33, #00000055); border: 2px solid #036fff; display: flex; align-items: center; justify-content: center; padding: 25px; }
    .package-item .image img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .package-item .name { background: linear-gradient(180deg, #036fff33, transparent); border: 2px solid #036fff55; border-radius: 36px; padding: 15px; }
    .package-item .name .icon { font-size: 40px; margin-bottom: 2px; line-height: 1; margin-top: -5px; }
    .package-item.epic .name .icon { color: #036fff; }
    .package-item .name h2 { font-size: 20px; font-weight: 800; text-transform: uppercase; color: #fff; margin: 0; }
    .package-item .price { color: #bcc1c9; font-weight: 700; font-size: 20px; background: linear-gradient(180deg, #036fff33, transparent); border: 2px solid #036fff55; border-radius: 36px; padding: 12px; }

    .join-title { margin: 0 50px 25px; font-size: 28px; font-weight: 900; color: #fff; text-align: center; }
    .gamemodes { display: flex; gap: 40px; margin: 40px 50px 15px; }
    .gamemodes a { flex: 1; min-height: 180px; background: #ffffff08; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; position: relative; transition: transform .15s ease; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05); }
    .gamemodes a:hover { transform: scale(1.02); }
    .gamemodes a span { width: 100%; text-align: center; padding: 25px; background: rgba(87,90,95,.64); backdrop-filter: blur(2px); font-size: 24px; font-weight: 900; color: #1e1e1e; text-shadow: 0 0 10px rgba(0,0,0,.32); }

    .join { display: flex; width: 100%; margin: 0 auto 50px; gap: 20px; flex-wrap: nowrap; align-items: center; justify-content: flex-start; }
    .join a { flex: 1; padding: 28px 30px; color: #fff; border-radius: 42px; border-bottom: 8px solid #000; text-align: center; transition: all .15s ease; display: flex; align-items: center; justify-content: center; }
    .join a:first-child, .join a:last-child { background: #1e1e1e; }
    .join a:nth-child(2) { background: #ffffff0d; }
    .join a:hover { background: #036fff !important; transform: translateY(-2px); }
    .join a .text { display: flex; flex-direction: column; align-items: center; }
    .join a h2 { font-size: 32px; font-weight: 800; margin: 0; display: flex; align-items: center; }
    .join a h2 i { color: #036fff; margin-right: 8px; }
    .join a:hover h2 i { color: #fff; }
    .join a p { font-weight: 600; color: #fff; font-size: 18px; margin: 3px 0 0; }
    .copy-tip { position: relative; }
    .copy-tip::after, .copy-tip::before { opacity: 0; pointer-events: none; }
    .copy-tip:hover::after { content: "Press to copy"; position: absolute; top: -70px; left: 50%; transform: translateX(-50%); background: #036fff; color: #fff; font-size: 16px; font-weight: 700; padding: 14px 28px; border-radius: 14px; white-space: nowrap; text-transform: uppercase; animation: tooltipIn 0.2s ease forwards; }
    .copy-tip:hover::before { content: ""; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); border: 10px solid transparent; border-top-color: #036fff; animation: tooltipIn 0.2s ease forwards; }
    .discord-tip:hover::after { content: "Press to join\A 10+"; white-space: pre-wrap; text-align: center; line-height: 1.3; padding: 12px 30px; font-size: 22px; top: -105px; }
    @keyframes tooltipIn { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    #foot { background: #1e1e1e; padding: 40px 0; color: grey; margin-top: auto; }
    #foot .container { display: flex; align-items: center; justify-content: center; color: #575a68; font-weight: 600; font-size: 15px; }
    #foot .copyright { text-align: center; font-size: 11px; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px; color: #70757a; }
    .copyright-text { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .copyright-text span { font-size: 18px; font-weight: 600; color: #797c89; text-transform: uppercase; }
    .copyright-text small { font-size: 12px; color: #575a68; font-weight: 600; }
    .copyright-links { display: flex; gap: 15px; text-transform: uppercase; font-size: 10px; white-space: nowrap; }
    .copyright-links a { color: #a7b2c1; font-weight: 600; }
    .copyright-links a:hover { color: #fff; }

    @media (max-width: 768px) {
      .top-nav { display: none; }
      .head { padding-top: 40px; }
      .ip-block { font-size: 18px; }
      .section-title { flex-direction: column; height: auto; }
      .package-wrap { flex-direction: column; align-items: center; }
      .package-item { max-width: 100%; }
      .gamemodes { flex-direction: column; gap: 15px; margin: 25px 20px; }
      .gamemodes a { min-height: 120px; }
      .join { flex-direction: column; width: 100%; }
      .join a h2 { font-size: 24px; }
      .join a p { }
      #foot .copyright { flex-direction: column; }
      .package-wrapper { padding: 25px 0; }
      #foot { padding: 25px 0; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="loading-wrap" id="loading">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#036fff" stroke-width="5" stroke-dasharray="250" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1s" repeatCount="indefinite"/>
        </circle>
      </svg>
      <strong>Loading...</strong>
    </div>

    <div class="head">
      <div class="top-nav">
        <a href="#" class="active">Home</a>
        <a href="staff.html">Staff</a>
      </div>
      <div class="logo">
        <img src="images/logo.png" alt="Logo" style="max-width: 124px;">
      </div>
      <div class="below-logo">
        <div class="ip-block copy-tip" id="ipBlock">
          <span>play.example.com</span>
          <span class="ip-players">10+</span>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="page-wrapper-inner">
        <div class="panel-wrap">
          <div class="container">
            <div class="tab-content">
              <div class="package-wrap">
                <a href="#" class="package-item epic">
                  <div class="image">
                    <img src="images/plus.png" alt="Plus">
                  </div>
                  <div class="name">
                    <h2>Plus</h2>
                  </div>
                  <div class="price">$5.00</div>
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="container">
          <div class="join">
            <a href="https://discord.gg/fE5ZaNwkpJ" target="_blank" class="copy-tip discord-tip">
              <div class="text">
                <h2><i class="fab fa-discord"></i> Discord</h2>
                <p>Join our community</p>
              </div>
            </a>
            <a href="javascript:void(0)" onclick="copyIP()" class="copy-tip">
              <div class="text">
                <h2><i class="fas fa-server"></i> Server IP</h2>
                <p>play.example.com</p>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>

    <div id="foot">
      <div class="container">
        <div class="copyright">
          <div class="copyright-text">
            <span>&copy; 2026 Example Store</span>
            <small>All rights reserved.</small>
          </div>
          <div class="copyright-links">
            <a href="terms.html">Terms of Service</a>
            <a href="privacy.html">Privacy Policy</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function hideLoading() { document.body.classList.remove('loading'); }
    window.addEventListener('load', hideLoading);
    setTimeout(hideLoading, 3000);
    document.body.classList.add('loading');

    function copyIP() {
      var ip = document.querySelector('.join a:last-child p').textContent.trim();
      navigator.clipboard.writeText(ip);
    }
    document.getElementById('ipBlock').addEventListener('click', function() {
      var ip = this.querySelector('span').textContent.trim();
      navigator.clipboard.writeText(ip);
    });
  </script>
</body>
</html>
