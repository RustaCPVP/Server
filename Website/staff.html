<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store | Staff</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; color: silver; font-family: 'proxima-nova', 'Raleway', sans-serif; background: #111; line-height: normal; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .page-wrapper { background: #111; min-height: 100vh; display: flex; flex-direction: column; }
    .main-content { flex: 1; }

    .head { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 20px 25px; }
    .top-nav { display: flex; align-items: center; justify-content: center; gap: 30px; margin-bottom: 40px; }
    .top-nav a { padding: 14px 20px; background: #212428; border-radius: 12px; color: #bababa; min-width: 114px; font-weight: 700; text-transform: uppercase; font-size: 13px; border: 2px solid #2a5870; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,.08); transition: all .15s ease; }
    .top-nav a:hover, .top-nav a.active { color: #fff; border-color: #036fff; }

    .panel-wrap { background: #1e1e1e; border-bottom: 8px solid #000; box-shadow: 0 10px 55px -3px rgba(0,0,0,.06), 0 4px 6px -2px rgba(0,0,0,.05); padding: 50px 0; }
    .panel-wrap h1 { color: #fff; font-size: 39px; font-weight: 900; text-align: center; margin-bottom: 40px; }

    .staff-grid { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; }
    .staff-card { background: #424549; border-radius: 36px; padding: 30px; text-align: center; border-bottom: 8px solid #000; flex: 0 1 250px; display: block; cursor: pointer; perspective: 600px; position: relative; }
    .staff-card .card-flipper { transition: transform .6s ease; transform-style: preserve-3d; position: relative; }
    .staff-card:hover .card-flipper { transform: rotateY(180deg); }
    .staff-card .front, .staff-card .back { backface-visibility: hidden; position: relative; }
    .staff-card .back { transform: rotateY(180deg); position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .staff-card .avatar { width: 80px; height: 80px; border-radius: 50%; background: #036fff; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 36px; color: #fff; }
    .staff-card .name { font-size: 20px; font-weight: 800; color: #fff; text-transform: uppercase; }
    .staff-card .role { font-size: 14px; color: #999; margin-top: 5px; font-weight: 600; }
    .staff-card .back-text { font-size: 16px; color: #fff; font-weight: 700; padding: 10px; }

    .staff-card.no-flip { cursor: pointer; }
    .staff-card.no-flip:hover { background: #036fff; }

    .back-link { text-align: center; margin-top: 30px; }
    .back-link a { color: #036fff; font-weight: 700; font-size: 14px; text-transform: uppercase; }
    .back-link a:hover { color: #fff; }

    #foot { background: #1e1e1e; padding: 40px 0; color: grey; margin-top: auto; }
    #foot .container { display: flex; align-items: center; justify-content: center; color: #575a68; font-weight: 600; font-size: 15px; }
    #foot .copyright { text-align: center; font-size: 11px; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px; color: #70757a; }
    .copyright-text { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .copyright-text span { font-size: 18px; font-weight: 600; color: #797c89; text-transform: uppercase; }
    .copyright-text small { font-size: 12px; color: #575a68; font-weight: 600; }
    .copyright-links { display: flex; gap: 15px; text-transform: uppercase; font-size: 10px; white-space: nowrap; }
    .copyright-links a { color: #a7b2c1; font-weight: 600; }
    .copyright-links a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="head">
      <div class="top-nav">
        <a href="index.html">Home</a>
        <a href="staff.html" class="active">Staff</a>
      </div>
    </div>

    <div class="main-content">
      <div class="panel-wrap">
        <div class="container">
          <h1>Our Staff Team</h1>
          <div class="staff-grid">
            <div class="staff-card">
              <div class="card-flipper">
                <div class="front">
                  <div class="avatar"><i class="fas fa-crown"></i></div>
                  <div class="name">Owner</div>
                  <div class="role">Server Owner</div>
                </div>
                <div class="back">
                  <div class="back-text">Owner</div>
                  <div class="back-text" style="font-size: 13px; color: #999;">The Boss</div>
                </div>
              </div>
            </div>
            <div class="staff-card">
              <div class="card-flipper">
                <div class="front">
                  <div class="avatar"><i class="fas fa-shield-alt"></i></div>
                  <div class="name">Admin</div>
                  <div class="role">Administrator</div>
                </div>
                <div class="back">
                  <div class="back-text">Admin</div>
                  <div class="back-text" style="font-size: 13px; color: #999;">Keeps order</div>
                </div>
              </div>
            </div>
            <div class="staff-card">
              <div class="card-flipper">
                <div class="front">
                  <div class="avatar"><i class="fas fa-hammer"></i></div>
                  <div class="name">Mod</div>
                  <div class="role">Moderator</div>
                </div>
                <div class="back">
                  <div class="back-text">Mod</div>
                  <div class="back-text" style="font-size: 13px; color: #999;">Watchdog</div>
                </div>
              </div>
            </div>
            <div class="staff-card">
              <div class="card-flipper">
                <div class="front">
                  <div class="avatar"><i class="fas fa-star"></i></div>
                  <div class="name">Helper</div>
                  <div class="role">Helper</div>
                </div>
                <div class="back">
                  <div class="back-text">Helper</div>
                  <div class="back-text" style="font-size: 13px; color: #999;">Here to help</div>
                </div>
              </div>
            </div>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="staff-card no-flip" target="_blank">
              <div class="avatar"><i class="fas fa-user-secret"></i></div>
              <div class="name">Shh secrete</div>
              <div class="role">Secret</div>
            </a>
          </div>
          <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
          </div>
        </div>
      </div>
    </div>

    <div id="foot">
      <div class="container">
        <div class="copyright">
          <div class="copyright-text">
            <span>&copy; 2026 Example Store</span>
            <small>All rights reserved.</small>
          </div>
          <div class="copyright-links">
            <a href="terms.html">Terms of Service</a>
            <a href="privacy.html">Privacy Policy</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
